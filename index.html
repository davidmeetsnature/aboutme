<!DOCTYPE html> <html lang="de"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>David Müller – Gesundheit, Natur & Freiheit</title> <meta name="description" content="David Müller – Gesundheitscoach & Business Partner. Ein ehrlicher Weg zu mehr Gesundheit und Freiheit."> <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"> <style> :root { --forest: #2E4A3E; --sage: #4A6B5D; --mist: #8FA99E; --cream: #F7F4EF; --warm: #EDE8DF; --dark: #1A2E26; --gold: #C4A882; --text: #2C3830; --text-mid: #5A6E65; --text-soft: #8FA99E; --serif: "Playfair Display", Georgia, serif; --sans: "DM Sans", sans-serif; } *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; } html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; } body { background: var(--cream); color: var(--text); font-family: var(--sans); line-height: 1.7; overflow-x: hidden; -webkit-font-smoothing: antialiased; } img { display: block; width: 100%; } a { text-decoration: none; color: inherit; } a, button { min-height: 44px; } /* NAV */ .nav { position: fixed; top: 0; left: 0; right: 0; z-index: 300; display: flex; justify-content: space-between; align-items: center; padding: 1.1rem 1.25rem; transition: background 0.35s, padding 0.35s; } .nav.scrolled { background: rgba(26,46,38,0.97); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 0.85rem 1.25rem; box-shadow: 0 2px 20px rgba(0,0,0,0.2); } .nav__logo { font-family: var(--serif); font-size: 1.1rem; color: #fff; z-index: 310; position: relative; } .nav__links { display: none; } .nav__cta-desktop { display: none; } .nav__burger { display: flex; flex-direction: column; justify-content: center; gap: 5px; width: 44px; height: 44px; padding: 10px; background: none; border: none; cursor: pointer; z-index: 310; } .nav__burger span { display: block; width: 22px; height: 1.5px; background: #fff; border-radius: 2px; transition: transform 0.35s ease, opacity 0.35s ease; transform-origin: center; } .nav__burger.active span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); } .nav__burger.active span:nth-child(2) { opacity: 0; transform: scaleX(0); } .nav__burger.active span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); } /* MOBILE MENU */ .mobile-menu { position: fixed; inset: 0; z-index: 200; background: var(--dark); display: flex; flex-direction: column; justify-content: center; padding: 2rem 2rem 4rem; opacity: 0; pointer-events: none; transform: translateY(-12px); transition: opacity 0.4s ease, transform 0.4s ease; } .mobile-menu.open { opacity: 1; pointer-events: all; transform: translateY(0); } body.menu-open { overflow: hidden; } .mobile-menu__label { font-size: 0.62rem; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--mist); margin-bottom: 2.5rem; } .mobile-menu__nav { list-style: none; } .mobile-menu__nav li { border-bottom: 1px solid rgba(255,255,255,0.07); opacity: 0; transform: translateX(-16px); transition: opacity 0.35s ease, transform 0.35s ease; } .mobile-menu__nav li:first-child { border-top: 1px solid rgba(255,255,255,0.07); } .mobile-menu.open .mobile-menu__nav li:nth-child(1) { opacity:1; transform:none; transition-delay:0.10s; } .mobile-menu.open .mobile-menu__nav li:nth-child(2) { opacity:1; transform:none; transition-delay:0.17s; } .mobile-menu.open .mobile-menu__nav li:nth-child(3) { opacity:1; transform:none; transition-delay:0.24s; } .mobile-menu.open .mobile-menu__nav li:nth-child(4) { opacity:1; transform:none; transition-delay:0.31s; } .mobile-menu__nav a { display: flex; align-items: center; justify-content: space-between; padding: 1.25rem 0; font-family: var(--serif); font-size: 1.55rem; color: rgba(255,255,255,0.85); transition: color 0.25s; } .mobile-menu__nav a:hover { color: var(--gold); } .mobile-menu__nav .arrow { font-size: 1rem; color: var(--mist); transition: transform 0.25s, color 0.25s; } .mobile-menu__nav a:hover .arrow { transform: translateX(4px); color: var(--gold); } .mobile-menu__cta-wrap { opacity:0; transform:translateY(8px); transition: opacity 0.35s ease 0.35s, transform 0.35s ease 0.35s; } .mobile-menu.open .mobile-menu__cta-wrap { opacity:1; transform:none; } .mobile-menu__cta { margin-top: 2.5rem; display: inline-flex; align-items: center; justify-content: center; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dark); background: var(--gold); padding: 1rem 2rem; border-radius: 2px; min-height: 52px; transition: background 0.3s; align-self: flex-start; } .mobile-menu__footer { margin-top: auto; padding-top: 2rem; font-size: 0.75rem; color: rgba(255,255,255,0.2); } /* HERO */ .hero { min-height: 100svh; position: relative; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 4.5rem; } .hero__bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center top; } .hero__overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(18,36,28,0.4) 0%, rgba(18,36,28,0.72) 45%, rgba(18,36,28,0.93) 100%); } .hero__content { position: relative; z-index: 2; padding: 0 1.25rem; } .hero__words { display: flex; flex-wrap: wrap; gap: 0; margin-bottom: 1.1rem; } .hero__word { font-size: 0.6rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.5); } .hero__word + .hero__word::before { content: " · "; color: var(--gold); } .hero__title { font-family: var(--serif); font-size: clamp(1.7rem, 6.5vw, 2.4rem); font-weight: 400; line-height: 1.35; color: #fff; margin-bottom: 1.25rem; } .hero__title .break { display: block; margin: 1.2rem 0; } .hero__title em { font-style: italic; color: rgba(255,255,255,0.65); } .hero__sub { font-size: 0.95rem; font-weight: 300; color: rgba(255,255,255,0.6); margin-bottom: 2rem; line-height: 1.8; max-width: 340px; } /* REST BLEIBT IDENTISCH */ </style> </head> <body> <!-- dein kompletter HTML bleibt unverändert --> </body> </html>
