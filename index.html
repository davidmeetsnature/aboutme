<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>David Müller</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  overflow-x: hidden; /* 🔥 DAS IST WICHTIG */
  font-family: 'Poppins', sans-serif;
}

/* NAV */
nav {
  position: absolute;
  width: 100%;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  z-index: 10;
  color: white;
}

.logo {
  font-weight: 600;
}

/* HERO */
.hero {
  width: 100%;
  min-height: 100vh;
  display: flex;
  align-items: center;

  background:
    linear-gradient(to right, rgba(0,0,0,0.65) 25%, rgba(0,0,0,0.2) 60%, transparent 100%),
    url('Hintergrund.png') center/cover no-repeat;
}

/* INNER CONTAINER */
.hero-inner {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 20px; /* 🔥 verhindert overflow */
}

/* CONTENT */
.hero-content {
  max-width: 550px;
  color: white;
}

/* LABEL */
.label {
  font-size: 12px;
  letter-spacing: 2px;
  opacity: 0.7;
}

/* HEADLINE */
.hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: 48px;
  line-height: 1.2;
  margin: 20px 0;
}

/* TEXT */
.hero p {
  font-size: 16px;
  opacity: 0.9;
}

/* BUTTONS */
.buttons {
  margin-top: 30px;
}

.btn {
  padding: 14px 28px;
  border-radius: 6px;
  text-decoration: none;
  margin-right: 10px;
  display: inline-block;
}

.btn-primary {
  background: #2f5d50;
  color: white;
}

.btn-secondary {
  border: 1px solid white;
  color: white;
}

/* MOBILE */
@media(max-width: 768px) {
  .hero h1 {
    font-size: 34px;
  }
}
</style>
</head>

<body>

<nav>
  <div class="logo">David Müller</div>
</nav>

<section class="hero">
  <div class="hero-inner">
    <div class="hero-content">

      <div class="label">DAVID MÜLLER</div>

      <h1>
        Klarheit leben.<br>
        Freiheit aufbauen.<br>
        Wirkung entfalten.
      </h1>

      <p>
        Für Menschen, die spüren, dass mehr möglich ist –
        und ihren eigenen Weg gehen wollen.
      </p>

      <div class="buttons">
        <a href="#termin" class="btn btn-primary">Strategiegespräch</a>
        <a href="#about" class="btn btn-secondary">Mehr erfahren</a>
      </div>

    </div>
  </div>
</section>

</body>
</html>
